# Dependabot will run on day 27 of each month at 01:21 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '0 3 * * 1'
      timezone: 'Europe/Berlin'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15

  - package-ecosystem: 'npm'
    directory: '/src-admin'
    schedule:
      interval: 'cron'
      cron: '0 4 * * 3'
      timezone: 'Europe/Berlin'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '0 5 * * 5'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 15
